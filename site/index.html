<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Loop</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%23F4B740' stroke-width='5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1320; --ink-2:#161D2E; --bone:#ECE6D8; --bone-lock:#E8DDB4;
    --ink-text:#1A1F2B; --slate:#26304a; --amber:#F4B740; --teal:#5FD0C5;
    --muted:#8893A8; --line:#23304b; --red:#E8736B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(120% 80% at 50% -10%, #1a2742 0%, var(--ink) 55%);
    color:var(--bone);font-family:"Space Grotesk",system-ui,sans-serif;display:flex;flex-direction:column;
    align-items:center;min-height:100%;padding:16px 16px 26px}
  header{width:100%;max-width:440px;text-align:center;position:relative}
  .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--amber);font-weight:500;margin:0 0 2px}
  h1{font-family:"Fraunces",serif;font-weight:600;font-size:37px;margin:0;line-height:1;letter-spacing:-.01em;
     display:flex;align-items:center;justify-content:center;gap:.28em}
  h1 .ring{display:inline-block;font-size:.7em;color:var(--amber)}
  .help{position:absolute;top:2px;right:0;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
    background:transparent;color:var(--muted);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:.15s}
  .help:hover{border-color:var(--amber);color:var(--amber)}

  .status{display:flex;align-items:center;justify-content:center;gap:18px;margin:13px 0 0;font-size:13px;color:var(--muted)}
  .lives{display:inline-flex;gap:4px;font-size:16px;line-height:1}
  .heart{filter:grayscale(0);transition:filter .3s}
  .heart.gone{filter:grayscale(1) opacity(.4)}
  .heart.pop{animation:heartpop .55s ease both}
  @keyframes heartpop{0%{transform:scale(1)}30%{transform:scale(1.7) rotate(-12deg)}60%{transform:scale(.7)}100%{transform:scale(1)}}
  .hints b{color:var(--bone)}

  .board-wrap{position:relative;width:min(92vw,384px);aspect-ratio:1;margin:14px auto 0}
  .board-wrap.shake{animation:boardshake .45s}
  @keyframes boardshake{0%,100%{transform:translate(0,0)}20%{transform:translate(-5px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,-1px)}80%{transform:translate(3px,1px)}}
  .glow{position:absolute;inset:6%;border-radius:50%;pointer-events:none;opacity:0;z-index:0;
    box-shadow:0 0 90px 26px #F4B74055, inset 0 0 70px 12px #F4B74033}
  .glow.on{animation:glowpulse 1.3s ease-out both}
  @keyframes glowpulse{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
  svg.edges{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:1}
  .edge{stroke:var(--slate);stroke-width:6;stroke-linecap:round;fill:none;transition:stroke .25s,stroke-width .25s}
  .edge.comp{stroke:var(--amber);stroke-width:8;filter:drop-shadow(0 0 6px #F4B74088);animation:linkin .35s ease-out}
  .edge.shar{stroke:var(--teal);stroke-width:7;stroke-dasharray:2 11;filter:drop-shadow(0 0 6px #5FD0C588);
    animation:linkin .35s ease-out, dashmarch 1.15s linear infinite}
  @keyframes linkin{0%{stroke-width:14}100%{}}
  @keyframes dashmarch{to{stroke-dashoffset:-13}}
  .edge.bad{stroke:var(--red);stroke-width:8;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(2px,-1px)}75%{transform:translate(-2px,1px)}}

  .tile{position:absolute;transform:translate(-50%,-50%);width:23.5%;aspect-ratio:1/.82;min-width:62px;
    background:var(--bone);color:var(--ink-text);border:none;border-radius:15px;font-family:"Space Grotesk",sans-serif;
    font-weight:700;font-size:clamp(11px,3.3vw,15px);letter-spacing:.03em;display:flex;align-items:center;
    justify-content:center;cursor:grab;user-select:none;touch-action:none;box-shadow:0 6px 14px #0006, inset 0 -3px 0 #00000018;
    transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .16s,outline-color .16s,
      left .22s cubic-bezier(.2,.9,.3,1.15),top .22s cubic-bezier(.2,.9,.3,1.15);
    outline:2.5px solid transparent;outline-offset:2px;z-index:2}
  .tile:focus-visible{outline-color:var(--amber)}
  .tile.sel{transform:translate(-50%,-50%) scale(1.12);box-shadow:0 12px 22px #0009;outline-color:var(--amber);z-index:5}
  .tile.drag{transition:transform .16s cubic-bezier(.2,.9,.3,1.3),box-shadow .16s;cursor:grabbing;z-index:9;
    transform:translate(-50%,-50%) scale(1.15) rotate(2deg);box-shadow:0 18px 30px #000b;outline-color:var(--amber)}
  .tile.lock{background:var(--bone-lock);cursor:default;box-shadow:0 6px 14px #0006, inset 0 0 0 2.5px var(--amber), inset 0 -3px 0 #00000018}
  .tile.lock::after{content:"\1F512";position:absolute;top:-9px;right:-6px;font-size:12px}
  .tile.win{animation:pop .5s ease both}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.08)}100%{transform:translate(-50%,-50%) scale(1)}}
  .tile.bump{animation:bump .34s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes bump{0%{transform:translate(-50%,-50%) scale(1)}45%{transform:translate(-50%,-50%) scale(1.16)}100%{transform:translate(-50%,-50%) scale(1)}}
  .tile.bad{animation:tilebad .5s ease;outline-color:var(--red)}
  @keyframes tilebad{0%,100%{transform:translate(-50%,-50%)}20%{transform:translate(-54%,-50%) rotate(-3deg)}
    40%{transform:translate(-46%,-50%) rotate(3deg)}60%{transform:translate(-53%,-50%)}80%{transform:translate(-47%,-50%)}}

  .hi{animation:hipulse 1.1s ease-in-out infinite!important}
  @keyframes hipulse{0%,100%{box-shadow:0 0 0 0 #F4B740cc,0 6px 14px #0006}50%{box-shadow:0 0 0 7px #F4B74022,0 6px 14px #0006}}

  .p{position:absolute;transform:translate(-50%,-50%);border-radius:50%;background:var(--c,#F4B740);
    pointer-events:none;z-index:8;animation:part .75s ease-out forwards}
  @keyframes part{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px))) scale(.3)}}

  .lbl{position:absolute;transform:translate(-50%,-50%) scale(.6);font-size:10px;font-weight:600;letter-spacing:.07em;
    padding:3px 7px;border-radius:999px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;z-index:6}
  .lbl.comp{background:var(--ink-2);color:var(--amber);border:1px solid var(--amber)}
  .lbl.shar{background:var(--ink-2);color:var(--teal);border:1px dashed var(--teal)}
  .lbl.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

  .hud{display:flex;align-items:center;gap:10px;margin-top:15px}
  .btn{background:transparent;color:var(--bone);border:1px solid var(--line);font-family:inherit;font-size:13px;
    font-weight:500;letter-spacing:.04em;padding:10px 16px;border-radius:10px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--amber);color:var(--amber)}.btn:active{transform:translateY(1px)}
  .btn:disabled{opacity:.4;cursor:default;pointer-events:none}
  .btn.primary{background:var(--amber);color:#1a1205;border-color:var(--amber);font-weight:700;padding:10px 22px}
  .btn.primary:hover{color:#1a1205;filter:brightness(1.05)}

  .coach{position:fixed;z-index:15;max-width:270px;background:var(--ink-2);border:1px solid var(--amber);
    border-radius:14px;padding:13px 14px;font-size:13px;line-height:1.5;color:var(--bone);
    box-shadow:0 14px 34px #000a;transition:top .3s ease,left .3s ease,opacity .3s;opacity:0;pointer-events:none}
  .coach.on{opacity:1}
  .coach .crow button{pointer-events:auto} /* bubble never blocks the board — only its buttons are clickable */
  .coach .crow{display:flex;gap:8px;justify-content:flex-end;align-items:center;margin-top:10px}
  .coach .crow .skip{background:none;border:none;color:var(--muted);font-family:inherit;font-size:12px;cursor:pointer;padding:6px}
  .coach .crow .skip:hover{color:var(--bone)}
  .coach .crow .btn{padding:7px 14px;font-size:12px}
  .coach b{color:var(--amber)}.coach i{color:var(--teal);font-style:normal}

  .modal{position:fixed;inset:0;background:#0b0f1ad9;backdrop-filter:blur(6px);display:flex;align-items:center;
    justify-content:center;padding:24px;opacity:0;pointer-events:none;transition:opacity .4s;z-index:20}
  .modal.on{opacity:1;pointer-events:auto}
  .card{background:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:24px 22px;max-width:344px;width:100%;
    text-align:center;transform:translateY(14px) scale(.98);transition:.4s cubic-bezier(.2,.9,.3,1.2)}
  .modal.on .card{transform:none}
  .card h2{font-family:"Fraunces",serif;font-weight:600;font-size:26px;margin:0 0 4px}
  .card .ringline{font-size:21px;letter-spacing:.1em;margin:12px 0 2px}
  .card p{color:var(--muted);font-size:13px;margin:6px 0 0;line-height:1.5}
  .card .chain{font-size:12px;letter-spacing:.03em;margin-top:14px;line-height:1.85;text-align:left}
  .card .chain:empty{display:none}
  .card .chain .c{color:var(--amber)}.card .chain .s{color:var(--teal)}
  .card .next{color:var(--amber);font-size:12px;letter-spacing:.08em;margin-top:12px}
  .card .next:empty{display:none}
  .card .row{display:flex;gap:10px;margin-top:18px}.card .row .btn{flex:1;text-align:center}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bone);
    color:var(--ink-text);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;transition:.3s;z-index:30}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
  <header>
    <p class="eyebrow" id="eyebrow">Daily</p>
    <h1>The Loop <span class="ring">&#10227;</span></h1>
    <button class="help" id="help" aria-label="How to play" title="How to play">?</button>
  </header>

  <div class="status">
    <span class="lives" id="lives"></span>
    <span class="hints">Hints <b id="hcount">0</b></span>
  </div>

  <div class="board-wrap" id="board">
    <div class="glow" id="glow"></div>
    <svg class="edges" viewBox="0 0 360 360" id="svg" aria-hidden="true"></svg>
  </div>

  <div class="hud">
    <button class="btn" id="hint">Hint</button>
    <button class="btn primary" id="submit">Submit</button>
    <button class="btn" id="shuffle">Reset</button>
  </div>

  <div class="modal" id="modal"><div class="card">
    <h2 id="mtitle"></h2>
    <div class="ringline" id="ringline"></div>
    <p id="msub"></p>
    <div class="chain" id="chain"></div>
    <p class="next" id="mnext"></p>
    <div class="row" id="mrow"></div>
  </div></div>
  <div class="toast" id="toast"></div>

<script>
(function(){
  // ----- daily puzzle loading -------------------------------------------
  // Puzzles are published by the pipeline to puzzles/YYYY-MM-DD.json.
  // Fallback order: ?d=YYYY-MM-DD override, today (local), latest.json,
  // then the built-in practice loop (also used when opened from disk and
  // as the tutorial board).
  const DEFAULT={
    number:0,
    words:["SUN","LIGHT","HOUSE","GROUND","WATER","FALL"],
    anchorIndex:0,
    bonds:{
      "FALL|SUN":["shar","DOWN"], "LIGHT|SUN":["comp","SUNLIGHT"], "HOUSE|LIGHT":["comp","LIGHTHOUSE"],
      "GROUND|HOUSE":["shar","WORK"], "GROUND|WATER":["comp","GROUNDWATER"], "FALL|WATER":["comp","WATERFALL"],
      "FALL|GROUND":["shar","BACK"], "FALL|HOUSE":["shar","OUT"], "HOUSE|SUN":["shar","LIGHT"]
    }
  };
  const TUT_FLAG='loop:tut:v1';
  function localISO(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  async function loadPuzzle(){
    const want=new URLSearchParams(location.search).get('d')||localISO();
    for(const url of [`puzzles/${want}.json`,'puzzles/latest.json']){
      try{
        const r=await fetch(url,{cache:'no-store'});
        if(r.ok){const p=await r.json();if(p&&Array.isArray(p.words)&&p.words.length===6)return p;}
      }catch(e){/* offline or file:// — fall through */}
    }
    return DEFAULT;
  }

  // deterministic shuffle so everyone gets the same starting board
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}

  // ----- game lifecycle: one active game at a time -----------------------
  let current=null,dailyPuzzle=null;
  function startGame(p,opts={}){
    if(current)current.destroy();
    current=initGame(p,opts);
  }
  function startTutorial(){
    startGame(DEFAULT,{tutorial:true,then:()=>startGame(dailyPuzzle)});
  }

  loadPuzzle().then(p=>{
    dailyPuzzle=p;
    document.getElementById('help').addEventListener('click',()=>{
      if(current&&current.isTutorial)return;
      startTutorial();
    });
    let seen=true;
    try{seen=!!localStorage.getItem(TUT_FLAG);}catch(e){/* no storage: don't force the tutorial every load */}
    if(!seen)startTutorial();else startGame(p);
  });

  function initGame(PUZ,opts={}){
  const TUT=!!opts.tutorial;
  const SOL=PUZ.words.map(w=>String(w).toUpperCase());
  const LOCK0=PUZ.anchorIndex||0;
  const BONDS=PUZ.bonds||{};
  const NUM=PUZ.number||0;
  document.getElementById('eyebrow').innerHTML=TUT?'How to play':(NUM
    ? `Daily &middot; No. ${NUM}`
    : 'Practice loop');

  const key=(a,b)=>[a,b].sort().join("|");
  const bond=(a,b)=>BONDS[key(a,b)]||null;
  const SOLEDGE=new Set();for(let i=0;i<6;i++)SOLEDGE.add(key(SOL[i],SOL[(i+1)%6]));
  const onLoop=(a,b)=>SOLEDGE.has(key(a,b));
  const T1=SOL.slice();
  const T2=SOL.map((_,i)=>SOL[(LOCK0*2-i+12)%6]); // mirror, same anchor

  const cx=180,cy=180,R=120,Cc={x:180,y:180},pos=[];
  for(let i=0;i<6;i++){const t=(-90+i*60)*Math.PI/180;pos.push({x:cx+R*Math.cos(t),y:cy+R*Math.sin(t)});}
  const pct=v=>`${v/360*100}%`;

  let slots=SOL.slice(),locked=new Set([LOCK0]),sel=-1,lives=3,hints=0,busy=false,target=null,shuffles=0;
  let done=null; // null | 'won' | 'lost' — daily one-shot state
  const svg=document.getElementById('svg'),board=document.getElementById('board'),glow=document.getElementById('glow');
  const hintBtn=document.getElementById('hint'),submitBtn=document.getElementById('submit'),shuffleBtn=document.getElementById('shuffle');
  const edgeEls=[],labelEls=[],labelPos=[],tileEls=[];
  const slotOf=w=>slots.indexOf(w);

  // ----- one shot a day: persistence in localStorage ---------------------
  // One entry per puzzle id, so archive days (?d=...) track independently
  // of today. The practice loop (number 0) and tutorial are never persisted.
  const PID=PUZ.id||('p'+NUM);
  const STORE_KEY='loop:v1:'+PID;
  let persistent=NUM>0&&!TUT;
  try{localStorage.setItem('loop:probe','1');localStorage.removeItem('loop:probe');}catch(e){persistent=false;}
  function saveState(){
    if(!persistent)return;
    try{
      localStorage.setItem(STORE_KEY,JSON.stringify({
        v:1,id:PID,number:NUM,slots,locked:[...locked],lives,hints,shuffles,
        status:done||'playing',savedAt:Date.now(),
      }));
      pruneStore();
    }catch(e){/* storage full/blocked — play on without persistence */}
  }
  function loadState(){
    if(!persistent)return null;
    try{
      const s=JSON.parse(localStorage.getItem(STORE_KEY)||'null');
      if(!s||s.v!==1||s.id!==PID)return null;
      if(!Array.isArray(s.slots)||s.slots.length!==6)return null;
      if([...s.slots].sort().join('|')!==[...SOL].sort().join('|'))return null;
      if(!Array.isArray(s.locked))return null;
      return s;
    }catch(e){return null;}
  }
  function pruneStore(){
    const keys=[];
    for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('loop:v1:'))keys.push(k);}
    if(keys.length<=12)return;
    keys.map(k=>{let t=0;try{t=JSON.parse(localStorage.getItem(k)).savedAt||0;}catch(e){}return{k,t};})
      .sort((a,b)=>a.t-b.t).slice(0,keys.length-12).forEach(({k})=>localStorage.removeItem(k));
  }

  for(let i=0;i<6;i++){
    const a=pos[i],b=pos[(i+1)%6];
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',a.x);ln.setAttribute('y1',a.y);ln.setAttribute('x2',b.x);ln.setAttribute('y2',b.y);
    ln.setAttribute('class','edge');svg.appendChild(ln);edgeEls.push(ln);
  }
  for(let i=0;i<6;i++){
    const a=pos[i],b=pos[(i+1)%6];let mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    mx=Cc.x+(mx-Cc.x)*0.58;my=Cc.y+(my-Cc.y)*0.58;
    labelPos.push({x:mx,y:my});
    const lab=document.createElement('div');lab.className='lbl';lab.style.left=pct(mx);lab.style.top=pct(my);
    board.appendChild(lab);labelEls.push(lab);
  }

  // ----- tiles: one element per WORD, positioned by its current slot ----
  // (that's what makes dragging feel physical: the element travels)
  let dragEl=null,dragSlot=-1,dragging=false,suppressClick=false,startX=0,startY=0;
  for(const w of SOL){
    const t=document.createElement('button');t.className='tile';t.textContent=w;t.dataset.word=w;
    t.addEventListener('click',()=>{
      if(suppressClick){suppressClick=false;return;}
      onTap(slotOf(w));
    });
    t.addEventListener('pointerdown',e=>{
      if(busy||done)return;
      const s=slotOf(w);
      if(locked.has(s))return;
      t.setPointerCapture(e.pointerId);
      dragEl=t;dragSlot=s;dragging=false;startX=e.clientX;startY=e.clientY;
    });
    t.addEventListener('pointermove',e=>{
      if(dragEl!==t)return;
      if(!dragging){
        if(Math.hypot(e.clientX-startX,e.clientY-startY)<7)return;
        dragging=true;sel=-1;t.classList.add('drag');render();
      }
      const r=board.getBoundingClientRect();
      const x=Math.max(16,Math.min(344,(e.clientX-r.left)/r.width*360));
      const y=Math.max(16,Math.min(344,(e.clientY-r.top)/r.height*360));
      t.style.left=pct(x);t.style.top=pct(y);
      // live preview: displace whoever sits in the nearest open slot
      let best=-1,bd=1e9;
      for(let i=0;i<6;i++){
        if(locked.has(i))continue;
        const d=Math.hypot(pos[i].x-x,pos[i].y-y);
        if(d<bd){bd=d;best=i;}
      }
      if(best!==-1&&bd<52&&best!==dragSlot){
        [slots[dragSlot],slots[best]]=[slots[best],slots[dragSlot]];
        dragSlot=best;buzz(8);render();
      }
    });
    const endDrag=()=>{
      if(dragEl!==t)return;
      if(dragging){suppressClick=true;t.classList.remove('drag');saveState();}
      const moved=dragging;
      dragEl=null;dragging=false;render();
      if(moved)afterMove();
    };
    t.addEventListener('pointerup',endDrag);
    t.addEventListener('pointercancel',endDrag);
    board.appendChild(t);tileEls.push(t);
  }
  const tileAtSlot=i=>tileEls.find(t=>t.dataset.word===slots[i]);
  const tileOfWord=w=>tileEls.find(t=>t.dataset.word===w);

  // ----- feedback helpers ------------------------------------------------
  const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
  function burst(x,y,color,n,dist){
    if(reduceMotion)return;
    for(let i=0;i<n;i++){
      const d=document.createElement('div');d.className='p';
      const ang=(i/n)*Math.PI*2+(i%2?0.35:0);
      const dd=dist*(0.65+((i*37)%10)/16);
      const sz=4+((i*13)%5);
      d.style.left=pct(x);d.style.top=pct(y);
      d.style.width=d.style.height=sz+'px';
      d.style.setProperty('--c',color);
      d.style.setProperty('--dx',Math.cos(ang)*dd+'px');
      d.style.setProperty('--dy',Math.sin(ang)*dd+'px');
      board.appendChild(d);setTimeout(()=>d.remove(),800);
    }
  }
  function bumpSlot(i){
    const t=tileAtSlot(i);if(!t)return;
    t.classList.remove('bump');void t.offsetWidth;t.classList.add('bump');
  }
  function markBad(i){
    for(const s of [i,(i+1)%6]){
      const t=tileAtSlot(s);if(!t)continue;
      t.classList.remove('bad');void t.offsetWidth;t.classList.add('bad');
      setTimeout(()=>t.classList.remove('bad'),650);
    }
    board.classList.add('shake');
    setTimeout(()=>board.classList.remove('shake'),500);
    buzz([40,50,40]);
  }

  // SVG elements ignore .className assignment (SVGAnimatedString) — always
  // set the attribute instead, or the edges silently never light up.
  const setEdge=(e,cls)=>e.setAttribute('class',cls);
  function lightEdge(i,withLabel=true){
    const a=slots[i],b=slots[(i+1)%6],r=bond(a,b);
    if(!r)return;
    const cls=r[0]==='comp'?'comp':'shar';
    setEdge(edgeEls[i],'edge '+cls);
    if(withLabel){
      labelEls[i].className='lbl show '+cls;
      labelEls[i].textContent=r[0]==='comp'?r[1]:('+'+r[1]);
    }
  }
  function clearEdges(){edgeEls.forEach(e=>setEdge(e,'edge'));labelEls.forEach(l=>{l.className='lbl';l.textContent='';});}
  function render(){
    for(const t of tileEls){
      const s=slotOf(t.dataset.word);
      if(t!==dragEl){t.style.left=pct(pos[s].x);t.style.top=pct(pos[s].y);}
      t.classList.toggle('sel',s===sel&&!busy);
      t.classList.toggle('lock',locked.has(s));
    }
    let h=document.getElementById('lives');h.innerHTML='';
    for(let i=0;i<3;i++){const s=document.createElement('span');s.className='heart'+(i<3-lives?' gone':'');s.textContent='♥';h.appendChild(s);}
    document.getElementById('hcount').textContent=hints;
  }

  function onTap(i){
    if(busy||done||locked.has(i))return;
    if(sel===-1){sel=i;render();return;}
    if(sel===i){sel=-1;render();return;}
    [slots[sel],slots[i]]=[slots[i],slots[sel]];sel=-1;buzz(8);render();saveState();
    afterMove();
  }
  function afterMove(){
    if(TUT)tutOnMove();
  }

  // reveal: travel the ring from the anchor; build each on-loop link; STOP + back out at first break.
  function submit(){
    if(busy)return;
    if(done){showResultModal();return;} // day finished — Submit becomes "Result"
    if(TUT)tutHideBubble();
    busy=true;sel=-1;clearEdges();render();
    let i=0;
    (function step(){
      const a=slots[i],b=slots[(i+1)%6],r=bond(a,b),ok=onLoop(a,b);
      const e=edgeEls[i],l=labelEls[i];
      if(ok){
        const cls=r[0]==='comp'?'comp':'shar';
        setEdge(e,'edge '+cls);
        l.className='lbl show '+cls;
        l.textContent=r[0]==='comp'?r[1]:('+'+r[1]);
        bumpSlot(i);bumpSlot((i+1)%6);
        burst(labelPos[i].x,labelPos[i].y,cls==='comp'?'#F4B740':'#5FD0C5',7,30);
        buzz(10);
        i++;
        if(i<6)setTimeout(step,430); else setTimeout(success,500);
      }else{
        setEdge(e,'edge bad');
        markBad(i);
        setTimeout(fail,750);
      }
    })();
  }
  function success(){
    busy=false;
    if(persistent){done='won';saveState();setDoneHud();}
    glow.classList.remove('on');void glow.offsetWidth;glow.classList.add('on');
    tileEls.forEach(t=>t.classList.add('win'));
    burst(cx,cy,'#F4B740',16,150);
    burst(cx,cy,'#5FD0C5',12,110);
    for(let i=0;i<6;i++)setTimeout(()=>burst(pos[i].x,pos[i].y,i%2?'#5FD0C5':'#F4B740',6,44),90*i);
    buzz([15,30,15,30,40]);
    setTimeout(TUT?showTutDoneModal:showWinModal,820);
  }
  function fail(){
    lives--;render();
    const goneHearts=document.querySelectorAll('#lives .heart');
    const justLost=goneHearts[3-lives-1];
    if(justLost)justLost.classList.add('pop');
    if(lives<=0){
      if(persistent){done='lost';setDoneHud();}
      saveState();
      setTimeout(()=>{busy=false;showLoseModal();},300);return;
    }
    saveState();
    setTimeout(()=>{clearEdges();busy=false;toast(`Not closed — ${lives} ${lives===1?'life':'lives'} left.`);},450);
  }

  // ----- daily done-state chrome -----------------------------------------
  function setDoneHud(){
    hintBtn.disabled=true;shuffleBtn.disabled=true;
    submitBtn.textContent='Result';
  }
  let nextTimer=null;
  const todayStr=localISO();
  function nextIn(){
    const now=new Date();
    const next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
    const ms=next-now,h=Math.floor(ms/3.6e6),m=Math.floor(ms%3.6e6/6e4);
    return h?`${h}h ${m}m`:`${m}m`;
  }
  function setCountdown(){
    const el=document.getElementById('mnext');
    clearInterval(nextTimer);
    if(!persistent||!done){el.textContent='';return;}
    const tick=()=>{
      if(localISO()!==todayStr){location.reload();return;} // midnight: fetch the new loop
      el.textContent=`Next loop in ${nextIn()}`;
    };
    tick();
    nextTimer=setInterval(tick,30000);
  }
  function closeModal(){
    document.getElementById('modal').classList.remove('on');
    clearInterval(nextTimer);
  }
  function showResultModal(){
    if(done==='lost')showLoseModal();else showWinModal();
  }
  function showWinModal(){
    let emoji='',parts=[];
    for(let i=0;i<6;i++){const a=slots[i],b=slots[(i+1)%6],r=bond(a,b);
      if(!r)continue;
      if(r[0]==='comp'){emoji+='\u{1F7E1}';parts.push(`<span class="c">${r[1]}</span>`);}
      else{emoji+='\u{1F7E6}';parts.push(`<span class="s">${a}&middot;${b} &rarr; +${r[1]}</span>`);}}
    const heartStr='❤️'.repeat(lives)+'\u{1F90D}'.repeat(3-lives);
    const buttons=persistent
      ? [['Copy result',()=>copy(emoji,heartStr),true],['Close',closeModal]]
      : [['Copy result',()=>copy(emoji,heartStr)],['Play again',freshGame,true]];
    showModal('Closed.',emoji,`${heartStr} · ${hints} hint${hints===1?'':'s'}`,parts.join('<br>'),buttons);
    setCountdown();
  }
  function showLoseModal(){
    const buttons=persistent
      ? [['Reveal loop',revealSolution],['Close',closeModal]]
      : [['Reveal loop',revealSolution],['Play again',freshGame,true]];
    showModal('Out of lives.','',`${hints} hint${hints===1?'':'s'} used — the loop stays open today`,'',buttons);
    setCountdown();
  }

  function chooseTarget(){
    if(target)return target;
    let s1=0,s2=0;for(let i=0;i<6;i++){if(slots[i]===T1[i])s1++;if(slots[i]===T2[i])s2++;}
    target=(s2>s1)?T2:T1;return target;
  }
  function hint(){
    if(busy||done)return;
    const unlocked=[];for(let i=0;i<6;i++)if(!locked.has(i))unlocked.push(i);
    if(unlocked.length===0){toast('Every tile is already locked.');return;}
    const tg=chooseTarget();
    const p=unlocked[Math.floor(Math.random()*unlocked.length)];   // pick a slot blindly
    if(slots[p]!==tg[p]){                                          // wrong word here? bring the right one in
      const q=slots.indexOf(tg[p]);
      [slots[p],slots[q]]=[slots[q],slots[p]];
    }                                                              // already right? just lock it
    locked.add(p);hints++;sel=-1;render();
    bumpSlot(p);saveState();
  }

  function revealSolution(){
    closeModal();
    slots=chooseTarget().slice();locked=new Set([0,1,2,3,4,5]);render();
    busy=true;clearEdges();let i=0;
    (function step(){
      lightEdge(i);
      i++;if(i<6)setTimeout(step,360);else{busy=false;}})();
  }

  // fast silent cascade used when restoring a solved board
  function replayReveal(cb){
    busy=true;clearEdges();let i=0;
    (function step(){
      lightEdge(i);
      i++;
      if(i<6)setTimeout(step,150);else{busy=false;tileEls.forEach(t=>t.classList.add('win'));cb&&cb();}
    })();
  }

  function showModal(title,emoji,sub,chain,buttons){
    document.getElementById('mtitle').textContent=title;
    document.getElementById('ringline').textContent=emoji;
    document.getElementById('msub').textContent=sub;
    document.getElementById('chain').innerHTML=chain;
    const row=document.getElementById('mrow');row.innerHTML='';
    buttons.forEach(([label,fn,primary])=>{const b=document.createElement('button');
      b.className='btn'+(primary?' primary':'');b.textContent=label;b.onclick=fn;row.appendChild(b);});
    document.getElementById('modal').classList.add('on');
  }
  function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1900);}
  async function copy(emoji,hearts){
    const tag=NUM?`The Loop ↻ No. ${NUM}`:'The Loop ↻';
    try{await navigator.clipboard.writeText(`${tag}\n${hearts}  ${hints} hints\n${emoji}`);toast('Copied');}catch(e){toast('Copy failed');}
  }

  function loopFull(arr){let c=0;for(let i=0;i<6;i++)if(onLoop(arr[i],arr[(i+1)%6]))c++;return c===6;}
  function scramble(){
    // seeded by puzzle number + reset count: every player sees the same board
    const rng=mulberry32((NUM*2654435761 ^ shuffles*97+1)>>>0);shuffles++;
    const open=[];for(let i=0;i<6;i++)if(!locked.has(i))open.push(i);
    const mov=open.map(i=>slots[i]);let tries=0;
    do{
      for(let i=mov.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[mov[i],mov[j]]=[mov[j],mov[i]];}
      open.forEach((s,k)=>{slots[s]=mov[k];});tries++;
    }while(loopFull(slots)&&tries<40);
  }
  function freshGame(){
    closeModal();
    slots=SOL.slice();locked=new Set([LOCK0]);shuffles=0;
    sel=-1;lives=3;hints=0;busy=false;target=null;done=null;
    hintBtn.disabled=false;shuffleBtn.disabled=false;submitBtn.textContent='Submit';
    scramble();
    tileEls.forEach(t=>t.classList.remove('win'));clearEdges();render();saveState();
  }
  // Reset only reshuffles the open tiles — it does NOT refund lives or hints
  // (it's one shot a day, not one shot per arrangement).
  function reshuffle(){
    if(busy||done)return;
    sel=-1;scramble();clearEdges();render();saveState();
  }

  const onSubmit=()=>submit(),onHint=()=>hint(),onReshuffle=()=>reshuffle();
  submitBtn.addEventListener('click',onSubmit);
  hintBtn.addEventListener('click',onHint);
  shuffleBtn.addEventListener('click',onReshuffle);

  // ----- tutorial: a 5/6-complete board that walks you through the fix ---
  // Only the two out-of-place tiles are unlocked, so the player literally
  // cannot make a wrong move; the coach bubble points at each thing in turn.
  let coach=null,tutStep=-1,hiEls=[];
  const onReplace=()=>{const s=TUTSTEPS[tutStep];if(s&&coach)placeCoach(s);};
  function tutSetup(){
    // LIGHT and HOUSE trade places: 4 correct edges light up, one swap fixes it
    slots=SOL.slice();
    [slots[1],slots[2]]=[slots[2],slots[1]];
    locked=new Set([0,3,4,5]);
    hintBtn.disabled=true;shuffleBtn.disabled=true;submitBtn.disabled=true;
    render();
    tutPreview();
    coach=document.createElement('div');coach.className='coach';document.body.appendChild(coach);
    window.addEventListener('resize',onReplace);
    setTimeout(tutNext,350);
  }
  function tutPreview(){
    // light every edge whose two neighbours already sit in their solution slot
    clearEdges();
    for(let i=0;i<6;i++){
      if(slots[i]===SOL[i]&&slots[(i+1)%6]===SOL[(i+1)%6])lightEdge(i);
    }
  }
  const boardRect=()=>board.getBoundingClientRect();
  const ptRect=(x,y)=>{const r=boardRect();const px=r.left+x/360*r.width,py=r.top+y/360*r.height;
    return{left:px,right:px,top:py,bottom:py,width:0,height:0};};
  const TUTSTEPS=[
    {text:`Six words, one ring. Every touching pair must <b>connect</b>. Three links are already made — two tiles traded places.`,
     anchor:()=>ptRect(cx,cy),next:true},
    {text:`A solid <b>amber</b> link means the two words fuse into one: WATER + FALL &rarr; <b>WATERFALL</b>.`,
     anchor:()=>ptRect(labelPos[4].x,labelPos[4].y),next:true},
    {text:`A dashed <i>teal</i> link means both words pair with the same hidden word: FALL and SUN both make one with <i>DOWN</i>.`,
     anchor:()=>ptRect(labelPos[5].x,labelPos[5].y),next:true},
    {text:`Fix the ring: <b>drag LIGHT onto HOUSE</b> to swap them. (Tapping one, then the other, works too.)`,
     anchor:()=>ptRect(52,300), // bottom-left: clear of the two tiles being dragged
     hi:()=>[tileOfWord('LIGHT'),tileOfWord('HOUSE')],wait:'swap'},
    {text:`The ring looks closed. Hit <b>Submit</b> — it checks the loop link by link.`,
     anchor:()=>submitBtn.getBoundingClientRect(),
     hi:()=>[submitBtn],wait:'submit'},
  ];
  function clearHi(){hiEls.forEach(e=>e&&e.classList.remove('hi'));hiEls=[];}
  function placeCoach(s){
    const r=s.anchor();
    coach.style.left='0px';coach.style.top='0px'; // reset so measurement is clean
    const w=coach.offsetWidth,h=coach.offsetHeight;
    let x=Math.min(Math.max(8,(r.left+r.right)/2-w/2),innerWidth-w-8);
    let y=r.bottom+12;
    if(y+h>innerHeight-12)y=r.top-h-12;
    coach.style.left=x+'px';coach.style.top=Math.max(8,y)+'px';
  }
  function tutNext(){
    clearHi();
    tutStep++;
    const s=TUTSTEPS[tutStep];
    if(!s){tutHideBubble();return;}
    coach.innerHTML=`${s.text}<div class="crow">
      <button class="skip">Skip tour</button>
      ${s.next?'<button class="btn primary">Next</button>':''}</div>`;
    coach.querySelector('.skip').onclick=finishTutorial;
    const nextBtn=coach.querySelector('.btn');
    if(nextBtn)nextBtn.onclick=tutNext;
    if(s.hi)hiEls=s.hi().map(e=>{e&&e.classList.add('hi');return e;});
    coach.classList.add('on');
    placeCoach(s);
  }
  function tutOnMove(){
    tutPreview();
    const s=TUTSTEPS[tutStep];
    if(s&&s.wait==='swap'&&slots.join('|')===SOL.join('|')){
      submitBtn.disabled=false;
      tutNext();
    }
  }
  function tutHideBubble(){
    clearHi();
    if(coach)coach.classList.remove('on');
  }
  function showTutDoneModal(){
    showModal("That's the game.",'\u{1F7E1}\u{1F7E1}\u{1F7E6}\u{1F7E1}\u{1F7E1}\u{1F7E6}',
      'One real loop a day. Three lives — and hints if you need them.','',
      [['Play today’s loop',finishTutorial,true]]);
  }
  function finishTutorial(){
    try{localStorage.setItem(TUT_FLAG,String(Date.now()));}catch(e){}
    closeModal();
    if(opts.then)opts.then();
  }

  // ----- start: tutorial, resume today's game, or fresh ------------------
  if(TUT){
    tutSetup();
  }else{
    const saved=loadState();
    if(saved){
      slots=saved.slots.slice();locked=new Set(saved.locked);
      lives=saved.lives;hints=saved.hints;shuffles=saved.shuffles||0;
      if(saved.status==='won'){
        done='won';setDoneHud();render();
        replayReveal(()=>setTimeout(showWinModal,350));
      }else if(saved.status==='lost'){
        done='lost';setDoneHud();render();
        setTimeout(showLoseModal,400);
      }else{
        render();
        if(lives<3||hints>0)toast('Welcome back — picking up where you left off.');
      }
    }else{
      freshGame();
    }
  }

  return {
    isTutorial:TUT,
    destroy(){
      clearInterval(nextTimer);
      submitBtn.removeEventListener('click',onSubmit);
      hintBtn.removeEventListener('click',onHint);
      shuffleBtn.removeEventListener('click',onReshuffle);
      window.removeEventListener('resize',onReplace);
      tileEls.forEach(t=>t.remove());
      labelEls.forEach(l=>l.remove());
      svg.innerHTML='';
      if(coach)coach.remove();
      glow.classList.remove('on');
      closeModal();
      hintBtn.disabled=false;shuffleBtn.disabled=false;
      submitBtn.disabled=false;submitBtn.textContent='Submit';
    },
  };
  }
})();
</script>
</body>
</html>
